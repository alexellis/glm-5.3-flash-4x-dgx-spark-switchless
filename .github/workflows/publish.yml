name: publish

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: actuated-arm64-8cpu-12gb
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Build and verify NCCL from source
        run: ./scripts/build-nccl.sh "$RUNNER_TEMP/nccl-patched"
      - name: Package NCCL with provenance
        run: ./scripts/package-nccl.sh "$RUNNER_TEMP/nccl-patched" ./bin
      - name: Upload release assets
        uses: alexellis/upload-assets@0.5.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          asset_paths: '["./bin/*"]'
