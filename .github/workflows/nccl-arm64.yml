name: NCCL ARM64 source build

on:
  push:
    branches:
      - master
    paths:
      - scripts/build-nccl.sh
      - scripts/package-nccl.sh
      - docs/nccl-build.md
      - .github/workflows/nccl-arm64.yml
      - .github/workflows/publish.yml
  pull_request:
    paths:
      - scripts/build-nccl.sh
      - scripts/package-nccl.sh
      - docs/nccl-build.md
      - .github/workflows/nccl-arm64.yml
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: actuated-arm64-8cpu-12gb
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build and verify NCCL from source
        run: ./scripts/build-nccl.sh "$RUNNER_TEMP/nccl-patched"
      - name: Build the release bundle
        run: ./scripts/package-nccl.sh "$RUNNER_TEMP/nccl-patched" "$RUNNER_TEMP/release"
